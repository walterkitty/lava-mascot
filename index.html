<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот ассистента</title>
<link rel="icon" href="assets/avalava-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root {
  --ground: #ff6a13;
  --fg: #141414;
  --muted: rgba(20, 20, 20, 0.64);
}
* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--fg);
  font-family: Manrope, sans-serif;
  -webkit-font-smoothing: antialiased;
}
section {
  min-height: 100svh;
  padding: 56px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  scroll-snap-align: start;
}
.hero { gap: 32px; text-align: center; }
.hero h1 {
  margin: 0;
  font-size: clamp(40px, 8vw, 88px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.hero p {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
}
.mascot { display: grid; place-items: center; cursor: pointer; }
</style>
</head>
<body>
<main>
  <section class="hero" id="hero">
    <div class="mascot" data-mascot="hero"></div>
    <h1>Маскот<br>ассистента</h1>
    <p>Чёрный плюш, уши наружу. Глаза: веко, светящаяся радужка, зрачок под веком.</p>
  </section>
</main>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="assets/lava-mascot.js"></script>
<script>
const { Assistant } = window.LavaMascot;
const h = React.createElement;

function heroSize() {
  return Math.round(Math.min(360, window.innerWidth * 0.72));
}

const heroRoot = ReactDOM.createRoot(document.querySelector('[data-mascot="hero"]'));
function renderHero() {
  const size = heroSize();
  heroRoot.render(h(Assistant, { size, theme: 'light', resolution: 3, style: { width: size, height: size } }));
}
renderHero();
window.addEventListener('resize', renderHero);
</script>
</body>
</html>
