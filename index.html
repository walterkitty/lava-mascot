<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот ассистента</title>
<meta name="description" content="Маскот ассистента Lava: состояния и эмоции.">
<link rel="icon" href="assets/avalava-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --background: #141515;
  --foreground: #ffffff;
  --card: #1e1f1f;
  --secondary: #2b2c2c;
  --border: #323434;
  --muted-foreground: #9aa1b1;
  --faint: #787d7d;
  --primary: #fafafa;
  --primary-foreground: #141515;
  --ground: #ff6a13;
  --radius: 10px;
  --side: 248px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Manrope, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

.side {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--side);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 32px;
  border-right: 1px solid var(--border);
  background: var(--background);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 600; }
.brand img { width: 22px; height: 22px; }
.brand small { font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.links { display: flex; flex-direction: column; gap: 2px; }
.links a {
  display: flex;
  gap: 12px;
  padding: 9px 8px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted-foreground);
}
.links a:hover, .links a[aria-current="true"] { color: var(--foreground); background: var(--card); }
.links a span { color: var(--faint); font-variant-numeric: tabular-nums; }
.switch {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--border);
}
.switch button {
  padding: 8px 0;
  border: 0;
  border-radius: 999px;
  background: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted-foreground);
  cursor: pointer;
}
.switch button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.topbar { display: none; }
.burger { display: none; }

main { margin-left: var(--side); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
section { padding: 96px 0; scroll-margin-top: 0; }
section + section { border-top: 1px solid var(--border); }

.eyebrow { font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
h1 {
  margin: 0;
  font-size: clamp(48px, 7vw, 80px);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.98;
  text-wrap: balance;
}
h2 {
  margin: 0;
  font-size: clamp(36px, 4.5vw, 48px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.lede { margin: 0; font-size: 18px; line-height: 1.55; color: var(--muted-foreground); text-wrap: pretty; max-width: 40ch; }
.edition { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }

.top { padding-top: 72px; }
.top-head { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: end; }
.top-head > div { display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }

.tile {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: var(--radius);
  background: var(--ground);
  overflow: hidden;
  cursor: pointer;
}
.tile.wide { aspect-ratio: 16 / 9; margin-top: 56px; cursor: default; }
.phone {
  position: relative;
  height: 88%;
  aspect-ratio: 390 / 844;
  border-radius: 9% / 4.2%;
  border: 6px solid #0d0d0d;
  overflow: hidden;
  background: var(--background);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
}
.phone img { display: block; width: 100%; height: 100%; }
.phone-mascot {
  position: absolute;
  left: 50%;
  top: 26.3%;
  width: 26%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.phone-mascot::before {
  content: "";
  position: absolute;
  inset: -45%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 106, 19, 0.42), rgba(255, 106, 19, 0) 100%);
  pointer-events: none;
}
.phone-mascot > * { position: relative; }
.grid { margin-top: 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
figcaption { display: flex; flex-direction: column; gap: 2px; }
figcaption b { font-size: 15px; font-weight: 600; }
figcaption span { font-size: 14px; color: var(--muted-foreground); }
.tag {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--secondary);
  font-size: 12px;
  font-weight: 600;
  font-style: normal;
  color: var(--foreground);
  vertical-align: 2px;
}

@media (max-width: 1023px) {
  .side {
    position: fixed;
    inset: 0;
    width: auto;
    border: 0;
    display: none;
    padding: 72px 16px 24px;
  }
  .side.open { display: flex; }
  .side .brand { display: none; }
  .switch { margin-top: 0; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 16px;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .burger {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
  }
  .burger svg { width: 20px; height: 20px; }
  main { margin-left: 0; }
  .wrap { padding: 0 16px; }
  section { padding: 64px 0; }
  .top { padding-top: 40px; }
  .top-head { grid-template-columns: 1fr; gap: 16px; }
  .tile.wide { aspect-ratio: 4 / 5; margin-top: 32px; }
}
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; gap: 24px; margin-top: 32px; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#top"><img src="assets/avalava-mark.svg" alt=""><span>Маскот</span></a>
  <button type="button" class="burger" aria-label="Меню" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
<aside class="side">
  <a class="brand" href="#top"><img src="assets/avalava-mark.svg" alt=""><span>Lava</span><small>Маскот</small></a>
  <nav class="links">
    <a href="#top"><span>01</span>Маскот</a>
    <a href="#states"><span>02</span>Состояния</a>
    <a href="#moods"><span>03</span>Эмоции</a>
  </nav>
  <div class="switch" role="group" aria-label="Шейдинг">
    <button type="button" data-shading="fabric" aria-pressed="true">3D</button>
    <button type="button" data-shading="flat" aria-pressed="false">2D</button>
  </div>
</aside>
<main>
  <section class="top" id="top">
    <div class="wrap">
      <div class="top-head">
        <div>
          <span class="eyebrow">Lava · ассистент</span>
          <h1>Маскот ассистента</h1>
        </div>
        <div>
          <p class="lede">Чёрный плюш, уши наружу. Глаза: веко, светящаяся радужка, зрачок под веком.</p>
          <span class="edition">Октябрь 2026</span>
        </div>
      </div>
      <div class="tile wide">
        <div class="phone">
          <img src="assets/img/assistant-new-chat.jpg" alt="Ассистент на телефоне: новый чат">
          <div class="phone-mascot" data-mascot="phone" data-theme="dark"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="states">
    <div class="wrap">
      <div class="head"><h2>Состояния</h2></div>
      <div class="grid">
        <figure><div class="tile" data-mascot="tile" data-state="default"></div><figcaption><b>Покой</b><span>default</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-state="working"></div><figcaption><b>Работа</b><span>working</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-state="sleeping"></div><figcaption><b>Сон</b><span>sleeping</span></figcaption></figure>
      </div>
    </div>
  </section>

  <section id="moods">
    <div class="wrap">
      <div class="head"><h2>Эмоции</h2></div>
      <div class="grid">
        <figure><div class="tile" data-mascot="tile" data-mood="angry"></div><figcaption><b>Злость<i class="tag">основная</i></b><span>Веко скошено к переносице, зрачок смотрит прямо.</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-mood="bored"></div><figcaption><b>Скука</b><span>bored</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-mood="happy"></div><figcaption><b>Радость</b><span>happy</span></figcaption></figure>
      </div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="assets/lava-mascot.js"></script>
<script>
const { Assistant } = window.LavaMascot;
const h = React.createElement;

const mounts = [...document.querySelectorAll('[data-mascot]')].map((el) => ({ el, root: ReactDOM.createRoot(el) }));

let shading = 'fabric';
try { if (localStorage.getItem('shading') === 'flat') shading = 'flat'; } catch {}

function render() {
  for (const { el, root } of mounts) {
    const box = el.getBoundingClientRect();
    const size = Math.round(Math.min(box.width, box.height) * (el.dataset.mascot === 'phone' ? 1 : 0.72));
    root.render(h(Assistant, {
      size,
      state: el.dataset.state || 'default',
      mood: el.dataset.mood || 'angry',
      shading,
      theme: el.dataset.theme || 'light',
      resolution: 3,
      style: { width: size, height: size },
    }));
  }
}

const switches = [...document.querySelectorAll('[data-shading]')];
function setShading(next) {
  shading = next;
  for (const b of switches) b.setAttribute('aria-pressed', String(b.dataset.shading === shading));
  try { localStorage.setItem('shading', shading); } catch {}
  render();
}
for (const b of switches) b.addEventListener('click', () => setShading(b.dataset.shading));
setShading(shading);
new ResizeObserver(render).observe(document.querySelector('main'));

const side = document.querySelector('.side');
const burger = document.querySelector('.burger');
function toggleMenu(open) {
  side.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', String(open));
}
burger.addEventListener('click', () => toggleMenu(!side.classList.contains('open')));
for (const a of side.querySelectorAll('a')) a.addEventListener('click', () => toggleMenu(false));

const links = [...document.querySelectorAll('.links a')];
const spy = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    for (const a of links) a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id));
  }
}, { rootMargin: '-45% 0px -50% 0px' });
for (const s of document.querySelectorAll('main section')) spy.observe(s);
</script>
</body>
</html>
