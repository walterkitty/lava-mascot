<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот ассистента</title>
<link rel="icon" href="assets/avalava-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root {
  --ground: #ff6a13;
  --fg: #141414;
  --muted: rgba(20, 20, 20, 0.64);
}
* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--fg);
  font-family: Manrope, sans-serif;
  -webkit-font-smoothing: antialiased;
}
section {
  min-height: 100svh;
  padding: 56px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  scroll-snap-align: start;
}
.hero { gap: 32px; text-align: center; }
.hero h1 {
  margin: 0;
  font-size: clamp(40px, 8vw, 88px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.hero p {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
}
.mascot { display: grid; place-items: center; cursor: pointer; }
h2 {
  margin: 0 0 48px;
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 800;
  letter-spacing: -0.02em;
  text-align: center;
}
.states {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 4vw, 48px);
  width: 100%;
  max-width: 960px;
}
.states.pair { grid-template-columns: repeat(2, 1fr); max-width: 640px; }
.state { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.state b { font-size: 18px; font-weight: 700; }
@media (max-width: 640px) {
  .states, .states.pair { grid-template-columns: 1fr; gap: 40px; }
}
</style>
</head>
<body>
<main>
  <section class="hero" id="hero">
    <div class="mascot" data-mascot="hero"></div>
    <h1>Маскот<br>ассистента</h1>
    <p>Чёрный плюш, уши наружу. Глаза: веко, светящаяся радужка, зрачок под веком.</p>
  </section>
  <section id="states">
    <h2>Состояния</h2>
    <div class="states">
      <div class="state"><div class="mascot" data-mascot="state" data-state="default"></div><b>Покой</b></div>
      <div class="state"><div class="mascot" data-mascot="state" data-state="working"></div><b>Работа</b></div>
      <div class="state"><div class="mascot" data-mascot="state" data-state="sleeping"></div><b>Сон</b></div>
    </div>
  </section>
  <section id="moods">
    <h2>Эмоции</h2>
    <div class="states pair">
      <div class="state"><div class="mascot" data-mascot="mood" data-mood="bored"></div><b>Скука</b></div>
      <div class="state"><div class="mascot" data-mascot="mood" data-mood="angry"></div><b>Злость</b></div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="assets/lava-mascot.js"></script>
<script>
const { Assistant } = window.LavaMascot;
const h = React.createElement;

const sizes = {
  hero: () => Math.min(360, window.innerWidth * 0.72),
  state: () => window.innerWidth <= 640 ? Math.min(240, window.innerWidth * 0.6) : Math.min(240, window.innerWidth * 0.24),
  mood: () => window.innerWidth <= 640 ? Math.min(240, window.innerWidth * 0.6) : Math.min(280, window.innerWidth * 0.3),
};

const mounts = [...document.querySelectorAll('[data-mascot]')].map((el) => ({
  el,
  root: ReactDOM.createRoot(el),
}));

function render() {
  for (const { el, root } of mounts) {
    const size = Math.round(sizes[el.dataset.mascot]());
    const state = el.dataset.state || 'default';
    const mood = el.dataset.mood || 'bored';
    root.render(h(Assistant, { size, state, mood, theme: 'light', resolution: 3, style: { width: size, height: size } }));
  }
}
render();
window.addEventListener('resize', render);
</script>
</body>
</html>
