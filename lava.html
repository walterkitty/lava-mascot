<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот ассистента · треугольник</title>
<meta name="description" content="Маскот ассистента Lava: состояния и эмоции.">
<link rel="icon" href="assets/avalava-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="lava" data-kit="Lava">
<header class="topbar">
  <a class="brand" href="#top"><img src="assets/avalava-mark.svg" alt=""><span>Маскот</span></a>
  <button type="button" class="burger" aria-label="Меню" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
<aside class="side">
  <a class="brand" href="#top"><img src="assets/avalava-mark.svg" alt=""><span>Lava</span><small>Треугольник</small></a>
  <nav class="links">
    <a href="#top"><span>01</span>Маскот</a>
    <a href="#states"><span>02</span>Состояния</a>
    <a href="#moods"><span>03</span>Эмоции</a>
  </nav>
</aside>
<main>
  <section class="top" id="top">
    <div class="wrap">
      <div class="top-head">
        <div>
          <h1>Lava assistant</h1>
        </div>
      </div>
      <div class="tile wide">
        <div class="phone">
          <img src="assets/img/assistant-new-chat.jpg" alt="Ассистент на телефоне: новый чат">
          <div class="phone-mascot" data-mascot="phone" data-theme="dark"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="states">
    <div class="wrap">
      <div class="head"><h2>Состояния</h2></div>
      <div class="grid">
        <figure><div class="tile" data-mascot="tile" data-state="default"></div><figcaption><b>Покой</b><span>default</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-state="working"></div><figcaption><b>Работа</b><span>working</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-state="sleeping"></div><figcaption><b>Сон</b><span>sleeping</span></figcaption></figure>
      </div>
    </div>
  </section>

  <section id="moods">
    <div class="wrap">
      <div class="head"><h2>Эмоции</h2></div>
      <div class="grid">
        <figure><div class="tile" data-mascot="tile" data-mood="angry"></div><figcaption><b>Злость<i class="tag">основная</i></b><span>angry</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-mood="bored"></div><figcaption><b>Скука</b><span>bored</span></figcaption></figure>
        <figure><div class="tile" data-mascot="tile" data-mood="happy"></div><figcaption><b>Радость</b><span>happy</span></figcaption></figure>
      </div>
    </div>
  </section>
</main>
<nav class="pages" aria-label="Варианты">
  <div class="group"><span>Кот</span><a href="./" data-page="cat" data-d="3d">3D</a><a href="./?2d" data-page="cat" data-d="2d">2D</a></div>
  <div class="group"><span>Глаза</span><a href="eyes.html" data-page="eyes" data-d="3d">3D</a><a href="eyes.html?2d" data-page="eyes" data-d="2d">2D</a></div>
  <div class="group"><span>Треугольник</span><a href="lava.html" data-page="lava" data-d="3d">3D</a><a href="lava.html?2d" data-page="lava" data-d="2d">2D</a></div>
</nav>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="assets/lava-mascot.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
